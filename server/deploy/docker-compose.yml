# Jalankan di VPS (folder server/deploy):
#   cp .env.example .env   &&  edit .env
#   docker compose up -d --build
services:
  bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8787"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LIVE_DOMAIN: ${LIVE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bridge

volumes:
  caddy_data:
  caddy_config:
