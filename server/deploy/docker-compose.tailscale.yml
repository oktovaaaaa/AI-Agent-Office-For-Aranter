# Varian untuk server dengan Tailscale Funnel (tanpa Caddy — HTTPS publik disediakan Funnel).
#   docker compose -f docker-compose.tailscale.yml up -d --build
#   tailscale funnel --bg --https=8443 http://127.0.0.1:8787
# Publik: https://<mesin>.<tailnet>.ts.net:8443  (443 tetap untuk project lain)
services:
  bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aranter_bridge
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"   # hanya lokal; akses publik lewat Funnel
