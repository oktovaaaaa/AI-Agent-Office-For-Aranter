<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aranter — Agent Office</title>
  <meta name="description" content="Kantor 3D tempat agent Aranter bekerja: screener, scanner RallyGood, analis SMC/DonAlt/MACD, dan kurir WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css?v=20261123e" />
  <script>window.ARANTER_BUILD = "20261123e";</script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "./js/agents.js": "./js/agents.js?v=20261123e",
        "./js/chat.js": "./js/chat.js?v=20261123e",
        "./js/config.js": "./js/config.js?v=20261123e",
        "./js/data.js": "./js/data.js?v=20261123e",
        "./js/fx.js": "./js/fx.js?v=20261123e",
        "./js/office.js": "./js/office.js?v=20261123e",
        "./js/sim.js": "./js/sim.js?v=20261123e",
        "./js/ui.js": "./js/ui.js?v=20261123e",
        "./js/nav.js": "./js/nav.js?v=20261123e",
        "./js/player.js": "./js/player.js?v=20261123e",
        "./js/camera.js": "./js/camera.js?v=20261123e"
      }
    }
  </script>
</head>
<body class="hide-tags">
  <div id="app"></div>

  <!-- Kiri atas: identitas + status -->
  <header class="brand-chip glass">
    <img class="logo-img" src="assets/aranter-logo.png?v=20261123e" alt="" width="26" height="26" />
    <span class="brand-name">Aranter</span>
    <button id="liveBadge" class="live" title="Status data">Replay</button>
  </header>

  <!-- Kanan atas: dua tombol ikon -->
  <nav class="fab-row">
    <button id="settingsBtn" class="fab glass" aria-label="Pengaturan" title="Pengaturan">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button id="chatToggle" class="fab glass" aria-label="Tanya Analis" title="Tanya Analis Riset AI">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
  </nav>

  <!-- Pengaturan (semua kontrol di sini) -->
  <section id="settings" class="settings glass" aria-label="Pengaturan">
    <div class="set-h">Pengaturan</div>
    <div class="set-row">
      <span>Kamera</span>
      <div class="seg">
        <button data-cam="drone" class="active" title="Terbang bebas di atas kantor">Drone</button>
        <button data-cam="third" title="Jadi karakter, kamera di belakang">Jalan</button>
        <button data-cam="first" title="Lihat dari mata karakter">Mata</button>
      </div>
    </div>
    <div id="viewRow" class="set-row col">
      <span>Sudut pandang</span>
      <div class="views">
        <button data-view="iso">Isometrik</button><button data-view="top">Atas</button><button data-view="front">Depan</button>
        <button data-view="scanner">Scanner</button><button data-view="vip">Lounge VVIP</button><button data-view="analyst">Analis</button><button data-view="research">Riset AI</button>
      </div>
    </div>
    <label class="set-row col">
      <span>Data scan</span>
      <select id="dateSelect" aria-label="Pilih tanggal scan"></select>
    </label>
    <div class="set-row">
      <span>Pemutaran</span>
      <div class="inline">
        <button id="btnPlay" class="pill">Jeda</button>
        <div class="seg">
          <button data-speed="1" class="active">1x</button>
          <button data-speed="3">3x</button>
          <button data-speed="10">10x</button>
        </div>
      </div>
    </div>
    <label class="set-row"><span>Nama agen</span><input type="checkbox" id="btnLabels" class="switch" /></label>
    <label class="set-row"><span>Label ruangan</span><input type="checkbox" id="optFloor" class="switch" /></label>
    <label class="set-row"><span>Aktivitas kantor</span><input type="checkbox" id="optLog" class="switch" /></label>
    <label class="set-row"><span>Ikuti LIVE otomatis</span><input type="checkbox" id="optLive" class="switch" checked /></label>
    <div id="srcInfo" class="set-foot">menghubungkan…</div>
  </section>

  <!-- Statistik: satu baris tipis -->
  <section class="stats glass">
    <div><b id="stTotal">0</b><span>saham</span></div>
    <div><b id="stProg">0/0</b><span>diproses</span></div>
    <div><b id="stVip" class="g">0</b><span>VVIP</span></div>
    <div><b id="stRadar" class="y">0</b><span>radar</span></div>
    <div><b id="stAlert">0</b><span>alert</span></div>
    <div class="prog"><i id="progFill"></i></div>
  </section>

  <!-- Aktivitas (disembunyikan, nyalakan dari Pengaturan) -->
  <section id="logBox" class="log glass hidden">
    <button id="logToggle" class="log-h" aria-expanded="true">Aktivitas <span class="chev">▸</span></button>
    <ul id="logList"></ul>
  </section>

  <div id="toast" class="toast" role="status"></div>
  <div id="joy" class="joy" aria-label="Joystick"><div id="joyKnob" class="joy-knob"></div></div>

  <aside id="panel" class="panel glass">
    <button id="panelClose" class="x" aria-label="Tutup">✕</button>
    <div id="panelBody"></div>
  </aside>

  <section id="chat" class="chat glass" aria-label="Chat Analis Riset AI">
    <div class="chat-h">
      <img class="logo-img sm" src="assets/aranter-logo.png?v=20261123e" alt="" width="22" height="22" />
      <div><b>Analis Riset AI</b><div id="chatEngine" class="src">…</div></div>
      <button id="chatClose" class="x" aria-label="Tutup chat">✕</button>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div id="chatChips" class="chips quick">
      <button class="chip ask" data-q="VVIP hari ini">VVIP hari ini</button>
      <button class="chip ask" data-q="berapa saham di screener?">Jumlah saham</button>
      <button class="chip ask" data-q="daftar radar 2 dot">Radar</button>
    </div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" autocomplete="off" maxlength="1200" placeholder="Tanya soal saham…" />
      <button id="chatSend" type="submit" aria-label="Kirim">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </form>
  </section>

  <div id="loading">
    <div class="ld-card">
      <img class="logo-img big" src="assets/aranter-logo.png?v=20261123e" alt="Aranter" width="72" height="72" />
      <div class="ld-title">Aranter</div>
      <div class="ld-bar"><i id="loadBar"></i></div>
      <div id="loadText" class="ld-text">Memuat…</div>
    </div>
  </div>

  <script>
    // Browser memblokir ES module dari file:// — beri petunjuk, jangan diam di "Memuat…"
    if (location.protocol === 'file:') {
      document.getElementById('loadText').innerHTML =
        'Halaman ini dibuka sebagai <b>file://</b>, browser memblokir modul JavaScript.<br>' +
        'Klik dua kali <b>start-office.bat</b> di folder ini, atau jalankan<br>' +
        '<code>python -m http.server 8080</code> lalu buka <b>http://localhost:8080</b>';
    }
  </script>
  <script type="module" src="js/main.js?v=20261123e"></script>
</body>
</html>
